<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Teste Traffic Flow
  </title>
</head>

<body>
  <h1>
    Teste de Tracking
  </h1>

  <p>
    Se tudo estiver correto,
    um page_view será enviado
    automaticamente.
  </p>

  <button
    id="checkout-button"
    type="button"
  >
    Testar Initiate Checkout
  </button>


  <script
    src="/traffic-flow.js"
    data-source-key="8bdcc714-d3ac-4891-abe3-369fb3890e59">
  </script>


  <script>
    document
      .getElementById(
        'checkout-button'
      )
      .addEventListener(
        'click',
        function () {
          if (
            !window.TrafficFlow
          ) {
            alert(
              'Traffic Flow ainda não carregou.'
            )

            return
          }

          window
            .TrafficFlow
            .track(
              'initiate_checkout',
              {
                offer_code:
                  'OFERTA-PADEL-TESTE'
              }
            )

          alert(
            'Evento initiate_checkout enviado!'
          )
        }
      )
  </script>
</body>
</html>
